services:
  - type: web
    name: assessoria-mei-pagamentos
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAGARME_SECRET_KEY
        sync: false
      - key: PAGARME_ACCOUNT_MODE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "false"
      - key: IDEMPOTENCY_SECRET
        generateValue: true
